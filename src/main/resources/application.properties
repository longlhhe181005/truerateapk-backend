# Hosting platforms set PORT
server.port=${PORT:8080}
# Behind a hosting proxy, take the real client address from X-Forwarded-For so the per-IP limit is per user
server.forward-headers-strategy=native
spring.application.name=truerate

# Optional local file with secrets (never commit). Example line: ANTHROPIC_API_KEY=sk-ant-...
spring.config.import=optional:file:./.env[.properties]

# AI agent. Leave the key empty to run in offline mode (fixed explanation templates).
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5}
anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
anthropic.timeout-seconds=20

# Used only when ANTHROPIC_API_KEY is empty
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}

# Photo upload (kept in memory only)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
truerate.ocr-timeout-seconds=40

# Simple per-IP protection for the API key
truerate.rate-limit-per-minute=30
